version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: shop-db
    restart: unless-stopped
    # 👇 ЖЕСТКИЕ ЗНАЧЕНИЯ (НЕ переменные). Это решает проблему создания БД
    environment:
      POSTGRES_USER: shop_user
      POSTGRES_PASSWORD: secret_password
      POSTGRES_DB: shop_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - shop-network
    ports:
      - "5432:5432"
    healthcheck:
      # 👇 В проверке тоже используем жесткие значения, чтобы не зависеть от .env
      test: ["CMD-SHELL", "pg_isready -U shop_user -d shop_db"]
      interval: 5s
      timeout: 5s
      retries: 10  # Увеличили до 10, чтобы на Windows база точно успела запуститься

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: shop-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: \${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: \${PGADMIN_PASSWORD}
    ports:
      - "5050:80"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - shop-network

  app:
    build: .
    container_name: shop-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    # 👇 Для сервиса app мы оставляем переменные, он будет брать их из твоего .env
    environment:
      DB_HOST: \${DB_HOST}
      DB_PORT: \${DB_PORT}
      DB_NAME: \${DB_NAME}
      DB_USER: \${DB_USER}
      DB_PASSWORD: \${DB_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - shop-network

volumes:
  pgdata:

networks:
  shop-network:
    driver: bridge
