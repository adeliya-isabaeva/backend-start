services:
  db:
    image: postgres:15-alpine
    container_name: shop-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: shop_user
      POSTGRES_PASSWORD: secret_password
      POSTGRES_DB: shop_db
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./seed.sql:/docker-entrypoint-initdb.d/seed.sql  # <-- ЭТА СТРОКА ОБЯЗАТЕЛЬНА!
    networks:
      - shop-network
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop_user -d shop_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: shop-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "5050:80"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - shop-network

  app:
    build: .
    container_name: shop-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # 👇 ЭТОГО НЕ ХВАТАЛО — именно эту строку должен читать твой код
      DATABASE_URL: postgresql://shop_user:secret_password@db:5432/shop_db

      # Эти переменные можно оставить, если ты собираешь URL вручную в коде,
      # но лучше, чтобы код брал сразу DATABASE_URL
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - shop-network

volumes:
  pgdata:

networks:
  shop-network:
    driver: bridge
