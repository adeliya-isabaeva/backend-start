name: API CI/CD  # Название пайплайна — будет видно во вкладке Actions

on:
  push:
    branches: [ "main", "aug3-clean" ]  # <-- поменяли здесь
  pull_request:
    branches: [ "main", "aug3-clean" ]  # <-- и здесь

jobs:
  build-and-test:  # Имя задачи (job)
    runs-on: ubuntu-latest  # На какой ОС запускать (GitHub даёт виртуальную машину)

    steps:
      # Шаг 1: Скачиваем твой код на эту виртуальную машину
      - name: Checkout code
        uses: actions/checkout@v4

      # Шаг 2: Ставим Python нужной версии
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"  # Укажи версию, на которой ты пишешь локально

      # Шаг 3: Устанавливаем зависимости (всё из requirements.txt)
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Шаг 4: Запускаем тесты (pytest)
      - name: Run tests
        run: pytest
