name: CI Pipeline (Debug)

on:
  push:
    branches:
      - main
      - aug3-clean
  pull_request:
    branches:
      - main
      - aug3-clean

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 15
        ports:
          - 5432:5432

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # --- ДИАГНОСТИЧЕСКИЙ ШАГ: ПРОВЕРКА СВЯЗИ С БАЗОЙ ---
      # Этот шаг НЕ трогает твой код. Он просто проверяет, может ли раннер увидеть сервис "db"
      - name: DEBUG: Check if DB service is reachable
        run: |
          echo "Пытаемся пропинговать хост 'db'..."
          getent hosts db
          if [ $? -eq 0 ]; then
            echo "✅ ХОСТ 'db' НАЙДЕН! Сеть работает."
          else
            echo "❌ ХОСТ 'db' НЕ НАЙДЕН! Проблема в services или отступах."
            exit 1
          fi
          
          echo "Пробуем подключиться через pg_isready (встроенная утилита postgres)..."
          # pg_isready идёт в образе postgres, но его нужно вызвать правильно. 
          # Проще проверить через telnet/nc, если есть, или просто показать, что имя резолвится.
          # getent выше уже доказал, что DNS внутри раннера видит 'db'.
        env:
          DATABASE_URL: postgresql://postgres:postgres@db:5432/postgres

      # ШАГ: Миграции (теперь запустится только если DEBUG прошёл успешно)
      - name: Apply DB Migrations
        run: alembic upgrade head
        env:
          DATABASE_URL: postgresql://postgres:postgres@db:5432/postgres

      - name: Run tests
        run: pytest
        env:
          DB_HOST: db
          DB_PORT: 5432
          DB_NAME: postgres
          DB_USER: postgres
          DB_PASSWORD: postgres
