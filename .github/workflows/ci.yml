name: CI

on:
  push:
    branches:
      - main
      - aug3-clean
  pull_request:
    branches:
      - main
      - aug3-clean

jobs:
  deploy:
    runs-on: ubuntu-latest

    # ВАЖНО: Здесь мы поднимаем базу данных как сервис-контейнер
    services:
      db:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mydb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Alembic Migrations
      env:
        # Эти переменные должны совпадать с теми, что в services.db.env выше
        DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/mydb
      run: alembic upgrade head
