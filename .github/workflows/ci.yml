name: CI Pipeline

on:
  push:
    branches:
      - main
      - aug3-clean
  pull_request:
    branches:
      - main
      - aug3-clean

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:15
        env:
          # В CI мы используем стандартного пользователя postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ШАГ 1: Миграции
      # Мы жестко задаем URL здесь. Он ПЕРЕКРОЕТ любые другие настройки в коде.
      # Формат: postgresql://user:pass@host:port/dbname
      # host=db (это имя сервиса из блока services выше)
      - name: Apply DB Migrations
        run: alembic upgrade head
        env:
          DATABASE_URL: postgresql://postgres:postgres@db:5432/postgres

      # ШАГ 2: Тесты
      # Если твои тесты собирают URL из отдельных переменных (DB_HOST, DB_USER и т.д.),
      # мы передаем им те же самые данные, что и для миграций.
      - name: Run tests
        run: pytest
        env:
          DB_HOST: db
          DB_PORT: 5432
          DB_NAME: postgres
          DB_USER: postgres
          DB_PASSWORD: postgres
          # Если твой код тестов тоже смотрит на DATABASE_URL, раскомментируй строку ниже:
          # DATABASE_URL: postgresql://postgres:postgres@db:5432/postgres
