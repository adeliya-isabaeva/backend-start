name: CI Pipeline

on:
  push:
    branches:
      - main
      - aug3-clean
  pull_request:
    branches:
      - main
      - aug3-clean

jobs:
  test:
    runs-on: ubuntu-latest

    # ВАЖНО: services стоит ровно под runs-on, без лишних отступов
    services:
      db:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

    # ВАЖНО: steps тоже стоит ровно под runs-on (на том же уровне, что и services)
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ШАГ: Миграции
      # Мы передаем URL, где host=db. Это сработает ТОЛЬКО если services выше запустился.
      - name: Apply DB Migrations
        run: alembic upgrade head
        env:
          DATABASE_URL: postgresql://postgres:postgres@db:5432/postgres

      # ШАГ: Тесты
      - name: Run tests
        run: pytest
        env:
          DB_HOST: db
          DB_PORT: 5432
          DB_NAME: postgres
          DB_USER: postgres
          DB_PASSWORD: postgres
