name: CI

on:
  push:
    branches:
      - main
      - aug3-clean
  pull_request:
    branches:
      - main
      - aug3-clean

jobs:
  build-and-migrate:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shop-db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        # Важно: setup-python сам активирует venv и добавляет его в PATH
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        # Эта команда покажет, что alembic реально установлен в этом окружении
        python -m alembic --version

    - name: Run Alembic Migrations
      env:
        DATABASE_URL: postgresql://postgres:postgres@postgres:5432/shop-db
      # ГЛАВНОЕ ИЗМЕНЕНИЕ ЗДЕСЬ:
      run: python -m alembic upgrade head