name: CI

on:
  push:
    branches:
      - main
      - aug3-clean
  pull_request:
    branches:
      - main
      - aug3-clean

jobs:
  build-and-migrate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shop-db  # <--- Теперь база будет называться shop-db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # ... шаги checkout и setup python ...

      - name: Run Alembic Migrations
        env:
          # Теперь это полностью соответствует имени базы, которую создал контейнер
          DATABASE_URL: postgresql://postgres:postgres@postgres:5432/shop-db
        run: alembic upgrade head
