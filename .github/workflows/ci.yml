name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:15
        env:
          POSTGRES_USER: shop_user
          POSTGRES_PASSWORD: secret_password
          POSTGRES_DB: shop_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ШАГ 1: Применяем миграции, чтобы создать таблицы в пустой базе
      # Если ты используешь Alembic. Если нет — см. примечание ниже.
      - name: Apply DB Migrations
        run: alembic upgrade head
        env:
          DB_HOST: db
          DB_PORT: 5432
          DB_NAME: shop_db
          DB_USER: shop_user
          DB_PASSWORD: secret_password

      # ШАГ 2: Запускаем тесты
      - name: Run tests
        run: pytest
        env:
          # Эти переменные подхватит твой database.py вместо дефолтных значений
          DB_HOST: db
          DB_PORT: 5432
          DB_NAME: shop_db
          DB_USER: shop_user
          DB_PASSWORD: secret_password
